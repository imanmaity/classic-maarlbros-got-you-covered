name: Weekly schedule update

on:
  schedule:
    # every 30 min, 06:00-17:00 IST, every day (GitHub cron is UTC; IST = UTC+5:30)
    - cron: "30 0 * * *"        # 06:00 IST
    - cron: "0,30 1-11 * * *"   # 06:30-17:00 IST
  workflow_dispatch:           # lets you run it manually from the Actions tab
    inputs:
      force_publish:
        description: "Publish even if the shrink-guard detects a big data drop (use only when the shrink is intentional)"
        type: boolean
        default: false

# contents: write lets the job push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Self-test (parser sanity check)
        run: python scripts/selftest.py

      - name: Fetch latest schedule from email
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SENDER: ${{ secrets.SENDER }}
          MAIL_SUBJECT: ${{ secrets.MAIL_SUBJECT }}
        run: python scripts/fetch_email.py rosters/schedule_latest.xlsx

      - name: Build dataset
        # force_publish is only ever true on a manual run with the box ticked;
        # scheduled runs always respect the shrink-guard.
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish && '1' || '' }}
        run: python scripts/build_dataset.py --input rosters --output data
      - name: Export JSON
        run: python scripts/export_json.py data/university.db data/schedule_data.json
      - name: Build app
        run: python scripts/build_app.py data/schedule_data.json site/index.html

      - name: Refuse to publish if the import had errors
        run: |
          if grep -q "\*\*ERROR\*\*" data/validation_report.md; then
            echo "::error::Import produced ERRORs — not publishing this week."
            cat data/validation_report.md
            exit 1
          fi

      # --- Publish the built site by force-pushing it to the gh-pages branch.
      #     This bypasses the actions/deploy-pages artifact path (the one hitting
      #     "Deployment failed, try again later"). After the first successful run,
      #     set Settings -> Pages -> Source -> "Deploy from a branch" -> gh-pages / (root). ---
      - name: Publish to gh-pages branch
        run: |
          rm -rf /tmp/ghp && cp -r site /tmp/ghp
          cd /tmp/ghp
          touch .nojekyll                       # serve files as-is (no Jekyll processing)
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) [${GITHUB_SHA::7}]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Pushed site/ to gh-pages."
